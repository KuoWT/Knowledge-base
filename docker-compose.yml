services:
  knowledge-base-api:
    image: kb-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KB_API_HOST: 0.0.0.0
      KB_API_PORT: "8080"
      KB_API_DB_PATH: /data/knowledge-base-api.db
      KB_API_REPO_PATH: /repo
      KB_API_MAIN_BRANCH: master
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: knowledge_base
      KB_API_WEBHOOK_TOKEN: ${KB_API_WEBHOOK_TOKEN:-}
      KB_API_LOG_LEVEL: ${KB_API_LOG_LEVEL:-INFO}
      KB_API_LOG_FORMAT: ${KB_API_LOG_FORMAT:-json}
    ports:
      - "${KB_API_HOST_PORT:-8080}:8080"
    labels:
      app: knowledge-base-api
      component: api
      env: ${KB_API_ENV:-prod}
      team: knowledge-base
    volumes:
      - hermes_data:/data
      - /home/obsidian-vault/1480AI:/repo
      - /root/.ssh:/root/.ssh
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    ipam:
      config:
        - subnet: 10.50.0.0/16

volumes:
  hermes_data:

services:
  knowledge-base-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HERMES_HOST: 0.0.0.0
      HERMES_PORT: "8080"
      HERMES_DB_PATH: /data/knowledge-base-api.db
      HERMES_REPO_PATH: /repo
      HERMES_MAIN_BRANCH: main
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_COLLECTION: knowledge_base
      HERMES_WEBHOOK_TOKEN: ${HERMES_WEBHOOK_TOKEN:-}
    ports:
      - "${HERMES_HOST_PORT:-8080}:8080"
    volumes:
      - hermes_data:/data
      - ./:/repo

volumes:
  hermes_data:

mcp_servers:
  knowledge_base:
    command: python3
    args:
      - -m
      - knowledge_base_api.mcp_server
    enabled: true
    timeout: 120
    connect_timeout: 60
    env:
      KB_API_BASE_URL: http://127.0.0.1:8081
      KB_API_WEBHOOK_TOKEN: your-webhook-token
      KB_API_HTTP_TIMEOUT: "30"
      KB_API_MCP_LOG_LEVEL: INFO
